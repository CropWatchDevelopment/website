name: Tests

# Runs the vitest suite (src/**/*.{test,spec}.{js,ts}) and publishes line
# coverage to Qlty Cloud. Authentication is OIDC, so no secret is needed.

on:
  push:
    branches:
      - master
      - Japan-website
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for the Qlty upload's OIDC authentication.
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The project uses pnpm (package.json#packageManager); Corepack provides
      # the exact pinned version.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      # `prepare` (svelte-kit sync) runs here, which the tests need for $app/*.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm exec vitest run --coverage

      # Pull requests from forks get no OIDC token, so skip the upload there.
      - name: Upload coverage to Qlty
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info
